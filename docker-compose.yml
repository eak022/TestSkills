services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot-simulator:
    build:
      context: ./oxide-monitor-candidate-pack/simulator
    image: elysai-bot-simulator
    container_name: bot-simulator
    ports:
      - "8788:8788"

volumes:
  postgres_data: